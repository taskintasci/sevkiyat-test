    .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgb(var(--c-surface-container-low)); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgb(var(--c-outline-variant)); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgb(var(--c-outline)); }

    @keyframes slideIn { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
