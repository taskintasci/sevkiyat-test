// ── YARDIMCI ──
function mesafe(a,b,c,d){const R=6371,dL=(c-a)*Math.PI/180,dN=(d-b)*Math.PI/180,x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dN/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function fmtTarih(ts){if(!ts)return"-";const d=ts.toDate?ts.toDate():new Date(ts);return d.toLocaleString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function aracTipi(t){if(t<=10)return{tip:"Kamyonet",max:10,icon:"🚐",renk:"#10B981"};if(t<=19)return{tip:"Kamyon",max:19,icon:"🚛",renk:"#3B82F6"};return{tip:"TIR",max:24,icon:"🚚",renk:"#F59E0B"};}
function tonajiBol(top){const lst=[];let k=top;while(k>0.01){let y=k>19?Math.min(k,24):k>10?Math.min(k,19):Math.min(k,10);y=parseFloat(y.toFixed(2));lst.push({...aracTipi(y===24?24:y===19?19:y),yukTon:y});k=parseFloat((k-y).toFixed(10));}return lst;}
function rotaSirala(pts){const kal=[...pts],s=[];let mv={lat:40.650,lng:29.267};while(kal.length){let ei=0,ed=Infinity;kal.forEach((n,i)=>{const d=mesafe(mv.lat,mv.lng,n.ilce.lat,n.ilce.lng);if(d<ed){ed=d;ei=i;}});s.push(kal[ei]);mv={lat:kal[ei].ilce.lat,lng:kal[ei].ilce.lng};kal.splice(ei,1);}return s;}
function grupla(sec){
  const MAX=24,YALOVA={lat:40.650,lng:29.267};
  if(!sec.length)return[];
  const rots=sec.map((s,i)=>({id:i,noktalar:[s],toplamTon:s.tonaj}));
  const tsk=[];
  for(let i=0;i<sec.length;i++)for(let j=i+1;j<sec.length;j++){
    const ni=sec[i],nj=sec[j];
    tsk.push({i,j,s:mesafe(YALOVA.lat,YALOVA.lng,ni.ilce.lat,ni.ilce.lng)+mesafe(YALOVA.lat,YALOVA.lng,nj.ilce.lat,nj.ilce.lng)-mesafe(ni.ilce.lat,ni.ilce.lng,nj.ilce.lat,nj.ilce.lng)});
  }
  tsk.sort((a,b)=>b.s-a.s);
  const nr=sec.map((_,i)=>i),rm=new Map(rots.map((r,i)=>[i,r]));
  for(const {i,j} of tsk){
    const ri=nr[i],rj=nr[j];if(ri===rj)continue;
    const rI=rm.get(ri),rJ=rm.get(rj);if(!rI||!rJ)continue;
    if(rI.toplamTon+rJ.toplamTon>MAX)continue;
    rI.noktalar=[...rI.noktalar,...rJ.noktalar];rI.toplamTon+=rJ.toplamTon;
    rJ.noktalar.forEach(n=>{const idx=sec.indexOf(n);if(idx>=0)nr[idx]=ri;});rm.delete(rj);
  }
  const res=[];let no=1;
  rm.forEach(r=>{const a=aracTipi(r.toplamTon);res.push({no:no++,noktalar:rotaSirala(r.noktalar),toplamTon:r.toplamTon,maxTon:a.max,tip:a.tip,icon:a.icon,renk:a.renk});});
  res.sort((a,b)=>b.toplamTon-a.toplamTon);res.forEach((k,i)=>k.no=i+1);return res;
}

function normH(h){return String(h).trim().replace(/[İI]/g,"I").replace(/[Şş]/g,"s").replace(/[Ğğ]/g,"g").replace(/[Üü]/g,"u").replace(/[Öö]/g,"o").replace(/[Çç]/g,"c").replace(/ı/g,"i").toLowerCase().replace(/^.*firma.*/,"firma").replace(/^.*ilc.*/,"ilce").replace(/^.*\bil\b.*/,"il").replace(/^.*seh.*/,"il").replace(/^.*fiy.*/,"fiyat").replace(/^.*\buc\b.*/,"fiyat").replace(/^.*tut.*/,"fiyat").replace(/^.*tel.*/,"tel").replace(/^.*ilet.*/,"tel");}
function normHdr(h){const s=String(h).trim();const l=s.replace(/İ/g,"I").replace(/Ş/g,"S").replace(/Ğ/g,"G").replace(/Ü/g,"U").replace(/Ö/g,"O").replace(/Ç/g,"C").replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c").toLowerCase();if(l.includes("firma"))return"firma";if(l.includes("ilc"))return"ilce";if((l.includes("il")&&!l.includes("ilc"))||l.includes("seh"))return"il";if(l.includes("fiy")||l.includes("tut"))return"fiyat";if(l.includes("tel")||l.includes("ilet"))return"tel";return l;}
async function excelOku(file){
  const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:"array"});const ws=wb.Sheets[wb.SheetNames[0]];const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
  let hr=-1;
  for(let i=0;i<Math.min(raw.length,15);i++){const t=raw[i].map(c=>normHdr(String(c))).filter(h=>["firma","il","ilce","fiyat","tel"].includes(h));if(t.length>=3){hr=i;break;}}
  if(hr===-1){showToast("Baslik satiri bulunamadi.",false);return[];}
  const hdrs=raw[hr].map(c=>normHdr(String(c))),rows=[];
  for(let i=hr+1;i<raw.length;i++){if(raw[i].every(c=>c===""||c===null))continue;const r={};hdrs.forEach((h,j)=>r[h]=String(raw[i][j]||"").trim());if(r.firma&&r.il&&r.ilce)rows.push(r);}
  return rows;
}
function rowsToFirmalar(rows){const m={};rows.forEach(r=>{const f=parseFloat(String(r.fiyat||"").replace(/[^\d.,]/g,"").replace(",","."));if(isNaN(f)||f<=0)return;if(!m[r.firma])m[r.firma]={ad:r.firma,iletisim:r.tel||"",fiyatlar:{}};m[r.firma].fiyatlar[r.il+"__"+r.ilce]=f;});return Object.values(m);}

function guzSA(ilce,il,renk){return `<div class="guz"><div class="gi"><span class="gdot start">●</span><span class="yalova">Yalova (Kalkis)</span></div><div class="gi"><span class="gdot" style="border-color:${renk}">○</span><span>${ilce}</span><span class="sub"> · ${il}</span></div><div class="gi"><span class="gdot start">◀</span><span class="sub">Yalova (Donus)</span></div></div>`;}
function guzP(k){let h=`<div class="guz"><div class="gi"><span class="gdot start">●</span><span class="yalova">Yalova (Kalkis)</span></div>`;k.noktalar.forEach(n=>{h+=`<div class="gi"><span class="gdot" style="border-color:${k.renk}">○</span><span>${n.ilce.ad}</span><span class="sub"> ${n.ilce.il}</span><span class="ston" style="color:${k.renk}">${n.tonaj} ton</span></div>`;});h+=`<div class="gi"><span class="gdot start">◀</span><span class="sub">Yalova (Donus)</span></div></div>`;return h;}
function piInput(id,val,fn){const ok=(val||"").trim().length>=3;return `<div class="piw"><input class="pi${ok?" ok":""}" id="${id}" type="text" placeholder="34 ABC 123" maxlength="12" value="${val||""}" oninput="${fn}" style="text-transform:uppercase"/><span id="${id}-c" class="${ok?"pchk":"preq"}">${ok?"✓":"Plaka"}</span></div>`;}
function acBox(id,val,fn){return `<div class="acw"><textarea id="${id}" class="aci" placeholder="Aciklama..." oninput="${fn}">${val||""}</textarea></div>`;}

// ── RENDER ──
function render(){
  const nav=["dashboard","sehirlerarasi","parsiyel","musteriler","firmalar"];
  const navLbls={"dashboard":"📊 Dashboard","sehirlerarasi":"🛣️ Sehirler Arasi","parsiyel":"📦 Parsiyel","musteriler":"🏢 Musteriler","firmalar":"⚙️ Firmalar"};
  const navCnt={"dashboard":0,"sehirlerarasi":S.saGecmis.length,"parsiyel":S.pGecmis.length,"musteriler":S.musteriler.length,"firmalar":S.firmalar.length};
  let navH="";
  nav.forEach(t=>{
    const b=navCnt[t]>0?`<span class="nbadge">${navCnt[t]}</span>`:"";
    navH+=`<button class="nav-btn${S.tab===t?" active":""}" onclick="ST('${t}')">${navLbls[t]}${b}</button>`;
  });
  const tst=S.toast?`<div class="msg ${S.toast.ok?"msg-ok":"msg-err"}">${S.toast.text}</div>`:"";
  let body="";
  if(S.loading)body=`<div class="loading"><div class="spinner"></div><p>Yukleniyor...</p></div>`;
  else if(S.tab==="dashboard")body=rDashboard();
  else if(S.tab==="sehirlerarasi")body=rSA();
  else if(S.tab==="parsiyel")body=rP();
  else if(S.tab==="musteriler")body=rMusteriler();
  else body=rFirmalar();
  document.getElementById("app").innerHTML=
    `<div class="header"><div class="logo"><div class="logo-icon">🚚</div><div><div class="logo-title">SEVKIYAT</div><div class="logo-sub">YONETIM SISTEMI</div></div></div><div class="kalkis-badge">● Kalkis: <strong>Yalova</strong></div></div>`+
    `<nav class="nav">${navH}</nav>${tst}<div class="content">${body}</div>`;
}

// ── SEHIRLER ARASI ──
function rSA(){
  const at=S.at.sa;
  const bb=S.sa_bekleme.length?`<span class="bbadge">${S.sa_bekleme.length}</span>`:"";
  return `<div class="atbar">
    <button class="at${at==="yeni"?" active":""}" onclick="SAT('yeni')">+ Yeni Sevkiyat</button>
    <button class="at${at==="plaka"?" active":""}" onclick="SAT('plaka')">🚘 Plaka Bekleme${bb}</button>
    <button class="at${at==="gecmis"?" active":""}" onclick="SAT('gecmis')">Gecmis (${S.saGecmis.length})</button>
  </div>${at==="yeni"?rSAYeni():at==="plaka"?rSAPlaka():rSAGecmis()}`;
}

function rSAYeni(){
  const il=S.sa_il?ILLER.find(x=>x.ad===S.sa_il):null;
  const ilceler=il?il.ilceler:[];
  const key=S.sa_il&&S.sa_ilce?S.sa_il+"__"+S.sa_ilce:null;
  const kars=key?S.firmalar.filter(f=>f.fiyatlar&&f.fiyatlar[key]!==undefined).map(f=>({firma:f,fiyat:f.fiyatlar[key]})).sort((a,b)=>a.fiyat-b.fiyat):[];
  const ton=parseFloat(S.sa_tonaj)||0;

  let ilOpts=`<option value="">— Il secin —</option>`;
  ILLER.forEach(x=>{ ilOpts+=`<option value="${x.ad}"${S.sa_il===x.ad?" selected":""}>${x.ad}</option>`; });
  let ilceOpts=`<option value="">— Ilce secin —</option>`;
  ilceler.forEach(x=>{ ilceOpts+=`<option value="${x}"${S.sa_ilce===x?" selected":""}>${x}</option>`; });

  let onizHTML=`<div class="sub" style="text-align:center;padding:8px">Tonaj girin → arac tipi hesaplanir</div>`;
  if(ton>0){
    const araclar=tonajiBol(ton);onizHTML="";
    araclar.forEach((a,i)=>{
      const pct=Math.round((a.yukTon/a.max)*100);
      onizHTML+=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><div style="display:flex;align-items:center;gap:8px"><span style="color:#64748b;font-size:12px">${i+1}.</span>${ab(a)}</div><span style="color:${a.renk};font-weight:700;font-size:14px">${a.yukTon.toFixed(1)} / ${a.max} ton</span></div>${pb(pct,a.renk)}`;
    });
    onizHTML+=`<div class="sub" style="margin-top:4px">Toplam ${ton.toFixed(1)} ton → ${araclar.length} arac</div>`;
  }

  let sagHTML="";
  if(!S.sa_ilce){
    sagHTML=`<div class="empty">🚛<br>Varis noktasi secin<br><small>Fiyat karsilastirmasi burada gorunecek</small></div>`;
  } else if(!kars.length){
    sagHTML=`<div class="empty">⚠️<br><strong>${S.sa_il} / ${S.sa_ilce}</strong><br><small>Bu guzergah icin fiyat bulunamadi</small></div>`;
  } else {
    sagHTML=`<div class="sub mb">${S.sa_il} / ${S.sa_ilce} icin <strong>${kars.length}</strong> firma</div>`;
    kars.forEach(({firma,fiyat},idx)=>{
      const top=idx===0,sel=S.sa_firma&&S.sa_firma.id===firma.id;
      sagHTML+=`<div class="fcard${top?" top":""}${sel?" sel":""}" onclick="SAFT('${firma.id}')">
        <div class="fleft"><div class="fno${top?" top":""}">${idx+1}</div>
        <div><div class="fad">${firma.ad}${top?" ⭐":""}</div>${firma.iletisim?`<div class="sub">📞 ${firma.iletisim}</div>`:""}</div></div>
        <div class="fright"><div class="fiyat${top?" ok":""}">${fiyat.toLocaleString("tr-TR")} ₺</div>${idx>0?`<div class="fark">+${(fiyat-kars[0].fiyat).toLocaleString("tr-TR")} ₺</div>`:""}</div>
      </div>`;
    });
    if(S.sa_firma) sagHTML+=`<button class="btnp mt" onclick="SAPGonder()" ${S.saving?"disabled":""}>🚘 Plaka Girisine Gonder</button>`;
  }

  return `<div class="grid2">
    <div>
      <div class="card mb"><div class="flbl">KALKIS NOKTASI</div><div class="krow"><span style="font-size:22px">📍</span><div><div class="il-title">Yalova</div><div class="sub">Sabit kalkis noktasi</div></div></div></div>
      <div class="field mb"><div class="flbl">MUSTERI / CARI</div>
        <select onchange="SAMUS(this.value)">
          <option value="">— Musteri secin (opsiyonel) —</option>
          ${S.musteriler.map(m=>`<option value="${m.ad}"${S.sa_musteri===m.ad?" selected":""}>${m.ad}${m.il?" — "+m.il+(m.ilce?" / "+m.ilce:""):""}</option>`).join("")}
        </select>
      </div>
      <div class="field mb"><div class="flbl">VARIS ILI</div><select onchange="SAIL(this.value)">${ilOpts}</select></div>
      <div class="field mb"><div class="flbl">VARIS ILCESI</div><select ${S.sa_il?"":"disabled"} onchange="SAILCE(this.value)">${ilceOpts}</select></div>
      <div class="field mb"><div class="flbl">YUKUN TONAJI</div>
        <input id="sa_ton" type="number" min="0.1" step="0.1" placeholder="Toplam ton girin..." value="${S.sa_tonaj}" oninput="SATON(this.value)" style="width:100%;margin-bottom:10px"/>
        <div id="sa-oniz">${onizHTML}</div>
      </div>
    </div>
    <div>${sagHTML}</div>
  </div>`;
}

function rSAPlaka(){
  if(!S.sa_bekleme.length)return`<div class="empty">🚘<br>Bekleyen sevkiyat yok<br><small>Yeni Sevkiyat sekmesinden olusturun</small></div>`;
  let h=`<div class="glist">`;
  S.sa_bekleme.forEach((b,bi)=>{
    // Müşteri kaydından sevk adresi bul
    const musteriRec=b.musteri?S.musteriler.find(m=>m.ad===b.musteri):null;
    const sevkAdresi=musteriRec?.sevk_adresi||"";
    h+=`<div class="pplan">
      <div class="pplanhdr">
        <div style="flex:1;min-width:0">
          <div class="grota">Yalova → ${b.il} / ${b.ilce}</div>
          <div class="sub" style="margin-top:3px">🚚 ${b.firma.ad}${b.firma.iletisim?" · 📞 "+b.firma.iletisim:""} · ${b.fiyat.toLocaleString("tr-TR")} ₺</div>
          <div class="sub">${b.toplamTon.toFixed(1)} ton · ${b.araclar.length} arac</div>
        </div>
        <button class="btns" onclick="SABS(${bi})">🗑️</button>
      </div>
      ${b.musteri?`<div class="cari-box">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span style="color:#8B5CF6;font-weight:700;font-size:14px">🏢 ${b.musteri}</span>
          ${sevkAdresi?`<span style="color:#94a3b8;font-size:12px">📌 ${sevkAdresi}</span>`:""}
        </div>
        ${musteriRec&&(musteriRec.il||musteriRec.ilce)?`<div class="sub" style="margin-top:2px">📍 ${[musteriRec.il,musteriRec.ilce].filter(Boolean).join(" / ")}</div>`:""}
      </div>`:""}`;
    b.araclar.forEach((a,ai)=>{
      const pct=Math.round((a.yukTon/a.max)*100);
      const plakaTamam=(a.plaka||"").trim().length>=3;
      h+=`<div class="pacrd" style="border-left:3px solid ${a.renk}">
        <div class="pahdr">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">${ab(a)}<span style="color:white;font-weight:600">${a.no}. Arac</span><span class="sub">${a.yukTon.toFixed(1)} / ${a.max} ton · ${pct}% dolu</span></div>
          ${piInput(`sap-${bi}-${ai}`,a.plaka,`SAP(${bi},${ai},this.value)`)}
        </div>
        ${pb(pct,a.renk)}${guzSA(b.ilce,b.il,a.renk)}
        ${acBox(`saa-${bi}-${ai}`,a.aciklama,`SAA(${bi},${ai},this.value)`)}
        <button class="btnp mt" id="sabtn-${bi}-${ai}" onclick="SAPK(${bi},${ai})" ${!plakaTamam||S.saving?"disabled":""}>${S.saving?"Kaydediliyor...":plakaTamam?"💾 Bu Araci Kaydet":"Plaka Girin"}</button>
      </div>`;
    });
    h+=`</div>`;
  });
  return h+"</div>";
}

function rSAGecmis(){
  if(!S.saGecmis.length)return`<div class="empty">📋<br>Henuz sevkiyat kaydi yok</div>`;
  let h=`<div class="glist">`;
  S.saGecmis.forEach(s=>{
    const araclar=s.araclar||[];const top=s.toplam_ton||s.tonaj||0;
    const durum=s.durum||"Planlandı";
    const durumCfg={
      "Planlandı":  {cls:"d-plan",  lbl:"📋 Planlandı"},
      "Yüklendi":   {cls:"d-yukle", lbl:"📦 Yuklendi"},
      "Yolda":      {cls:"d-yolda", lbl:"🚛 Yolda"},
      "Teslim Edildi":{cls:"d-teslim",lbl:"✅ Teslim Edildi"},
      "İptal":      {cls:"d-iptal", lbl:"❌ Iptal"}
    };
    const dc=durumCfg[durum]||durumCfg["Planlandı"];
    h+=`<div class="gdcrd"><div class="gdhdr"><div>
      <div class="grota">Yalova → ${s.varis_il} / ${s.varis_ilce}</div>
      <div class="sub">${s.firma_ad} · ${fmtTarih(s.tarih)}</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap">
        ${s.musteri?`<span class="mbadge">👤 ${s.musteri}</span>`:""}
        <span class="sub">${top.toFixed(1)} ton · ${araclar.length||1} arac</span>
      </div>
    </div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
      <div style="display:flex;align-items:center;gap:8px">
        <div class="fiyat ok" style="font-size:18px">${(s.fiyat||0).toLocaleString("tr-TR")} ₺</div>
        <button class="btns" onclick="SASil('${s.id}')">🗑️</button>
      </div>
      <select class="dsel ${dc.cls}" onchange="SADurum('${s.id}',this.value)">
        ${["Planlandı","Yüklendi","Yolda","Teslim Edildi","İptal"].map(d=>`<option value="${d}"${durum===d?" selected":""}>${(durumCfg[d]||{lbl:d}).lbl}</option>`).join("")}
      </select>
    </div></div>`;
    if(araclar.length){
      araclar.forEach(a=>{
        const pct=Math.round(((a.yukTon||0)/a.max)*100);
        h+=`<div class="gacrd" style="border-left:3px solid ${a.renk}"><div class="gahdr">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">${ab(a)}<span style="color:white;font-weight:600">${a.no}. Arac</span>${a.plaka?`<span class="pbadge">🚘 ${a.plaka}`+"</span>":""}</div>
          <div style="text-align:right"><div style="color:${a.renk};font-weight:700">${(a.yukTon||0).toFixed(1)} / ${a.max} ton</div><div class="sub">${pct}% dolu</div></div>
        </div>${pb(pct,a.renk)}${guzSA(s.varis_ilce,s.varis_il,a.renk)}${a.aciklama?`<div class="acg">💬 ${a.aciklama}</div>`:""}</div>`;
      });
    } else {
      h+=`<div class="gacrd" style="border-left:3px solid #64748b"><div class="sub">${top.toFixed(1)} ton</div></div>`;
    }
    h+="</div>";
  });
  return h+"</div>";
}

// ── PARSIYEL ──
function rP(){
  const at=S.at.p;
  const bb=S.p_bekleme.length?`<span class="bbadge">${S.p_bekleme.length}</span>`:"";
  return `<div class="atbar">
    <button class="at${at==="yeni"?" active":""}" onclick="PT('yeni')">+ Yeni Plan</button>
    <button class="at${at==="plaka"?" active":""}" onclick="PT('plaka')">🚘 Plaka Bekleme${bb}</button>
    <button class="at${at==="gecmis"?" active":""}" onclick="PT('gecmis')">Gecmis (${S.pGecmis.length})</button>
  </div>${at==="yeni"?rPYeni():at==="plaka"?rPPlaka():rPGecmis()}`;
}

function rPYeni(){
  const PI=S.p_il?(PARSIYEL[S.p_il]||{ilceler:[]}).ilceler.filter(i=>!S.p_sec.find(s=>s.ilce.ad===i.ad)):[];
  const km=S.p_sec.length?grupla(S.p_sec):[];
  const top=S.p_sec.reduce((a,b)=>a+b.tonaj,0);
  let ilOpts=`<option value="">— Il secin —</option>`;
  Object.keys(PARSIYEL).forEach(il=>{ ilOpts+=`<option value="${il}"${S.p_il===il?" selected":""}>${il}</option>`; });
  let ilceOpts=`<option value="">— Ilce secin —</option>`;
  PI.forEach(i=>{ ilceOpts+=`<option value="${i.ad}"${S.p_ilce===i.ad?" selected":""}>${i.ad}</option>`; });

  let secH="";
  if(S.p_sec.length){
    secH=`<div class="shdr"><span class="sub">${S.p_sec.length} nokta · Toplam <strong>${top.toFixed(1)} ton</strong></span><button class="btnl" onclick="PTemizle()">Tumunu sil</button></div>`;
    S.p_sec.forEach(item=>{
      const rk=(PARSIYEL[item.ilce.il]||{renk:"#888"}).renk;
      secH+=`<div class="sitem"><div class="sdot" style="background:${rk}"></div><span class="sad">${item.ilce.ad}</span><span class="sub">${item.ilce.il}</span><span class="ston">${item.tonaj} ton</span><button class="btnl" onclick="PCikar('${item.ilce.ad}')">✕</button></div>`;
    });
  }

  let sagH="";
  if(!S.p_sec.length){
    sagH=`<div class="empty">📦<br>Varis noktalari ekleyin<br><small>Kamyonet ≤10t · Kamyon ≤19t · TIR ≤24t</small></div>`;
  } else {
    sagH=`<div class="sub mb">${top.toFixed(1)} ton icin <strong>${km.length} arac</strong> hesaplandi</div>`;
    km.forEach(k=>{
      const pct=Math.round((k.toplamTon/k.maxTon)*100);
      sagH+=`<div class="kcrd" style="border-left:4px solid ${k.renk}">
        <div class="khdr">
          <div style="display:flex;align-items:center;gap:10px">${ab(k)}<span class="sub">${k.no}. arac · ${k.noktalar.length} durak</span></div>
          <div style="text-align:right"><div style="color:${k.renk};font-weight:700">${k.toplamTon.toFixed(1)} / ${k.maxTon} ton</div><div style="color:#64748b;font-size:11px">${pct}% dolu</div></div>
        </div>${pb(pct,k.renk)}${guzP(k)}</div>`;
    });
    sagH+=`<button class="btnp mt" onclick="PPGonder()" ${S.saving?"disabled":""}>🚘 Plaka Girisine Gonder</button>`;
  }

  return `<div class="grid2">
    <div>
      <div class="card mb"><div class="flbl">VARIS NOKTASI EKLE</div>
        <select class="mb-sm" onchange="PIL(this.value)">${ilOpts}</select>
        <select class="mb-sm" ${S.p_il?"":"disabled"} onchange="PILCE(this.value)">${ilceOpts}</select>
        <div class="irow"><input id="p_ton" type="number" min="0.1" max="24" step="0.1" placeholder="Tonaj (ton)"/><button class="btna" onclick="PEkle()">+ Ekle</button></div>
      </div>
      ${secH}
    </div>
    <div>${sagH}</div>
  </div>`;
}

function rPPlaka(){
  if(!S.p_bekleme.length)return`<div class="empty">🚘<br>Bekleyen plan yok<br><small>Yeni Plan sekmesinden olusturun</small></div>`;
  let h=`<div class="glist">`;
  S.p_bekleme.forEach((plan,pi)=>{
    const musteriRec=plan.musteri?S.musteriler.find(m=>m.ad===plan.musteri):null;
    const sevkAdresi=musteriRec?.sevk_adresi||"";
    h+=`<div class="pplan">
      <div class="pplanhdr">
        <div style="flex:1;min-width:0">
          <div class="grota">Plan #${pi+1} — ${plan.kamyonlar.length} Arac · ${plan.toplam_ilce} Nokta · ${plan.toplam_ton.toFixed(1)} ton</div>
          <div class="sub" style="margin-top:3px">Her arac icin plaka girip ayri ayri kaydedin</div>
        </div>
        <button class="btns" onclick="PBS(${pi})">🗑️</button>
      </div>
      ${plan.musteri?`<div class="cari-box">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span style="color:#8B5CF6;font-weight:700;font-size:14px">🏢 ${plan.musteri}</span>
          ${sevkAdresi?`<span style="color:#94a3b8;font-size:12px">📌 ${sevkAdresi}</span>`:""}
        </div>
        ${musteriRec&&(musteriRec.il||musteriRec.ilce)?`<div class="sub" style="margin-top:2px">📍 ${[musteriRec.il,musteriRec.ilce].filter(Boolean).join(" / ")}</div>`:""}
      </div>`:""}`;
    plan.kamyonlar.forEach(k=>{
      const pct=Math.round((k.toplamTon/k.maxTon)*100);
      const plakaTamam=(k.plaka||"").trim().length>=3;
      h+=`<div class="pacrd" style="border-left:3px solid ${k.renk}">
        <div class="pahdr">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">${ab(k)}<span style="color:white;font-weight:600">${k.no}. Arac</span><span class="sub">${k.noktalar.length} durak · ${k.toplamTon.toFixed(1)}/${k.maxTon}t · %${pct}</span></div>
          ${piInput(`pp-${pi}-${k.no}`,k.plaka,`PP(${pi},${k.no},this.value)`)}
        </div>
        ${pb(pct,k.renk)}${guzP(k)}
        ${acBox(`pa-${pi}-${k.no}`,k.aciklama,`PA(${pi},${k.no},this.value)`)}
        <button class="btnp mt" id="pbtn-${pi}-${k.no}" onclick="PPK(${pi},${k.no})" ${!plakaTamam||S.saving?"disabled":""}>${S.saving?"Kaydediliyor...":plakaTamam?"💾 Bu Araci Kaydet":"Plaka Girin"}</button>
      </div>`;
    });
    h+=`</div>`;
  });
  return h+"</div>";
}

function rPGecmis(){
  if(!S.pGecmis.length)return`<div class="empty">📋<br>Henuz parsiyel plan kaydi yok</div>`;
  let h=`<div class="glist">`;
  S.pGecmis.forEach(p=>{
    h+=`<div class="gdcrd"><div class="gdhdr"><div>
      <div class="grota">${p.kamyon_sayisi||0} Arac · ${p.toplam_ilce||0} Nokta · ${(p.toplam_ton||0).toFixed(1)} ton</div>
      <div class="sub">${fmtTarih(p.tarih)}</div>
    </div><button class="btns" onclick="PSil('${p.id}')">🗑️</button></div>`;
    (p.kamyonlar||[]).forEach(k=>{
      const a=aracTipi(k.toplam_ton||0);const pct=Math.round(((k.toplam_ton||0)/(k.max_ton||24))*100);
      const fk={renk:a.renk,noktalar:(k.noktalar||[]).map(n=>({ilce:{ad:n.ilce||n,il:n.il||""},tonaj:n.tonaj||0}))};
      h+=`<div class="gacrd" style="border-left:3px solid ${a.renk}"><div class="gahdr">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">${ab(a)}<span style="color:white;font-weight:600">${k.no}. Arac</span>${k.plaka?`<span class="pbadge">🚘 ${k.plaka}`+"</span>":""}</div>
        <div style="text-align:right"><div style="color:${a.renk};font-weight:700">${(k.toplam_ton||0).toFixed(1)} / ${k.max_ton||24} ton</div><div class="sub">${pct}% dolu</div></div>
      </div>${pb(pct,a.renk)}${guzP(fk)}${k.aciklama?`<div class="acg">💬 ${k.aciklama}</div>`:""}</div>`;
    });
    h+="</div>";
  });
  return h+"</div>";
}

function rDashboard(){

  const toplamFiyat=sa.reduce((a,s)=>a+(s.fiyat||0),0);
  const toplamTon=sa.reduce((a,s)=>a+(s.toplam_ton||s.tonaj||0),0);

  const durumSay={};sa.forEach(s=>{const d=s.durum||"Planlandı";durumSay[d]=(durumSay[d]||0)+1;});

  const firmaList=Object.values(firmaMap).sort((a,b)=>b.sayi-a.sayi).slice(0,5);
  const musteriMap={};sa.forEach(s=>{if(!s.musteri)return;if(!musteriMap[s.musteri])musteriMap[s.musteri]={ad:s.musteri,sayi:0,toplam:0};musteriMap[s.musteri].sayi++;musteriMap[s.musteri].toplam+=(s.fiyat||0);});
  const musteriList=Object.values(musteriMap).sort((a,b)=>b.toplam-a.toplam).slice(0,5);
  const ayMap={};for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");ayMap[k]=0;}
  sa.forEach(s=>{if(!s.tarih)return;const d=s.tarih.toDate?s.tarih.toDate():new Date(s.tarih);const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");if(ayMap[k]!==undefined)ayMap[k]+=(s.fiyat||0);});
  const aylar=Object.entries(ayMap);const maxAy=Math.max(...aylar.map(a=>a[1]),1);
  const durumRenkler={"Planlandı":"#64748b","Yüklendi":"#3B82F6","Yolda":"#F59E0B","Teslim Edildi":"#10B981","İptal":"#EF4444"};
  const kartlar=[
    {lbl:"Toplam Sevkiyat",val:sa.length,sub:"tum zamanlar",ic:"🛣️",renk:"#3B82F6"},
    {lbl:"Bu Ay Sevkiyat",val:saAy.length,sub:"bu ay",ic:"📅",renk:"#F59E0B"},
    {lbl:"Toplam Harcama",val:toplamFiyat.toLocaleString("tr-TR")+" ₺",sub:"sehirler arasi",ic:"💰",renk:"#10B981"},
    {lbl:"Toplam Yuk",val:(toplamTon+toplamPTon).toFixed(1)+" ton",sub:"SA + Parsiyel",ic:"📦",renk:"#8B5CF6"},
  ];
  let h=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:24px">`;
  kartlar.forEach(c=>{h+=`<div class="dcard"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div class="flbl">${c.lbl}</div><div style="font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;color:white;margin-top:4px">${c.val}</div><div class="sub">${c.sub}</div></div><div style="font-size:28px">${c.ic}</div></div></div>`;});
  h+="</div>";
  h+=`<div class="grid2" style="margin-bottom:24px">`;
  // Aylık trend
  h+=`<div class="card"><div class="flbl" style="margin-bottom:14px">AYLIK HARCAMA TRENDI (Son 6 Ay)</div><div style="display:flex;align-items:flex-end;gap:6px;height:120px">`;

    const pct=Math.round((val/maxAy)*100);
    const tarih=new Date(ay+"-01");const ayAd=tarih.toLocaleString("tr-TR",{month:"short"});
    h+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px"><div style="font-size:10px;color:#64748b">${val>0?Math.round(val/1000)+"K":""}</div><div style="flex:1;width:100%;display:flex;align-items:flex-end"><div style="width:100%;height:${Math.max(pct,4)}%;background:${pct>0?"#F59E0B":"#1E2D47"};border-radius:4px 4px 0 0"></div></div><div style="font-size:10px;color:#94a3b8">${ayAd}</div></div>`;
  });
  h+=`</div></div>`;
  // Durum dağılımı
  h+=`<div class="card"><div class="flbl" style="margin-bottom:14px">SEVKIYAT DURUM DAGILIMI</div>`;
  Object.keys(durumRenkler).forEach(d=>{

  h+=`</div></div>`;

  h+=`<div class="grid2">`;
  h+=`<div class="card"><div class="flbl" style="margin-bottom:14px">FIRMA PERFORMANSI</div>`;
  if(!firmaList.length)h+=`<div class="empty" style="padding:20px">Henuz veri yok</div>`;
  firmaList.forEach((f,i)=>{h+=`<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #1E2D47"><div style="width:24px;height:24px;border-radius:50%;background:#1E2D47;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#F59E0B;flex-shrink:0">${i+1}</div><div style="flex:1;min-width:0"><div style="color:white;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.ad}</div><div class="sub">${f.sayi} sevkiyat</div></div><div style="text-align:right;flex-shrink:0"><div style="color:#10B981;font-weight:700;font-size:14px">${f.toplam.toLocaleString("tr-TR")} ₺</div></div></div>`;});
  h+=`</div>`;
  h+=`<div class="card"><div class="flbl" style="margin-bottom:14px">MUSTERI ANALIZI</div>`;
  if(!musteriList.length)h+=`<div class="empty" style="padding:20px">Musteri atanmis sevkiyat yok</div>`;
  musteriList.forEach((m,i)=>{h+=`<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #1E2D47"><div style="width:24px;height:24px;border-radius:50%;background:#1E2D47;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#8B5CF6;flex-shrink:0">${i+1}</div><div style="flex:1;min-width:0"><div style="color:white;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.ad}</div><div class="sub">${m.sayi} sevkiyat</div></div><div style="text-align:right;flex-shrink:0"><div style="color:#8B5CF6;font-weight:700;font-size:14px">${m.toplam.toLocaleString("tr-TR")} ₺</div></div></div>`;});
  h+=`</div></div>`;
  h+=`<div style="margin-top:20px;text-align:right"><button class="btno" onclick="ExcelRapor()">📥 Tum Sevkiyatlari Excel Olarak Indir</button></div>`;
  return h;
}

        noktalar:k.noktalar.map(n=>({ilce:n.ilce.ad,il:n.ilce.il,tonaj:n.tonaj}))}]
    });
    // Bu kamyonu plandan çıkar
    plan.kamyonlar=plan.kamyonlar.filter(x=>x.no!==kno);
    // Planda kamyon kalmadıysa planı da kaldır
    if(plan.kamyonlar.length===0) S.p_bekleme.splice(pi,1);
    S.pGecmis=await pGetir();
    if(!S.p_bekleme.length)S.at.p="gecmis";
    showToast("✅ Arac kaydedildi!");
  }catch(e){showToast("❌ Hata: "+e.message,false);}finally{S.saving=false;render();}
};

window.MusteriExcel=async input=>{
  const file=input.files[0];if(!file)return;
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:"array"});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
    let headerRow=-1;
    for(let i=0;i<Math.min(raw.length,10);i++){
      const r=raw[i].map(c=>String(c).toLowerCase());
      if(r.some(c=>c.includes("must")||c.includes("cari")||c.includes("firma")||c.includes("ad"))){headerRow=i;break;}
    }
    const start=headerRow>=0?headerRow+1:1;
    const rows=[];
    for(let i=start;i<raw.length;i++){
      const r=raw[i];
      if(!r[0]||String(r[0]).trim()==="")continue;
      rows.push({
        ad:         String(r[0]||"").trim(),
        sevk_adresi:String(r[1]||"").trim(),
        il:         String(r[2]||"").trim(),
        ilce:       String(r[3]||"").trim()
      });
    }
    if(!rows.length){showToast("Gecerli veri bulunamadi.",false);return;}
    if(!confirm(rows.length+" musteri bulundu. Firebase'e yuklensin mi?"))return;
    await musteriTopluKaydet(rows);
    S.musteriler=await musteriGetir();
    showToast("✅ "+rows.length+" musteri yuklendi!");render();
  }catch(e){showToast("❌ Hata: "+e.message,false);}
  input.value="";
};
window.MusteriDrop=async e=>{

};

window.ExcelRapor=()=>{
  const wb=XLSX.utils.book_new();
  // Şehirler arası sheet
  const saData=[["Tarih","Musteri","Varis Il","Varis Ilce","Firma","Plaka(lar)","Tonaj","Fiyat (TL)","Durum"]];
  S.saGecmis.forEach(s=>{
    const tarih=s.tarih?(s.tarih.toDate?s.tarih.toDate():new Date(s.tarih)).toLocaleDateString("tr-TR"):"";
    const plakalar=(s.araclar||[]).map(a=>a.plaka||"").filter(Boolean).join(", ");
    saData.push([tarih,s.musteri||"",s.varis_il,s.varis_ilce,s.firma_ad,plakalar,s.toplam_ton||s.tonaj||"",s.fiyat||0,s.durum||"Planlandı"]);
  });
  const ws1=XLSX.utils.aoa_to_sheet(saData);ws1["!cols"]=[{wch:14},{wch:16},{wch:12},{wch:14},{wch:22},{wch:16},{wch:10},{wch:14},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws1,"Sehirler Arasi");
  // Parsiyel sheet
  const pData=[["Tarih","Kamyon No","Arac Tipi","Plaka","Durak Sayisi","Toplam Ton","Aciklama"]];
  S.pGecmis.forEach(p=>{
    const tarih=p.tarih?(p.tarih.toDate?p.tarih.toDate():new Date(p.tarih)).toLocaleDateString("tr-TR"):"";
    (p.kamyonlar||[]).forEach(k=>{pData.push([tarih,k.no,k.tip||"",k.plaka||"",(k.noktalar||[]).length,k.toplam_ton||"",k.aciklama||""]);});
  });
  const ws2=XLSX.utils.aoa_to_sheet(pData);ws2["!cols"]=[{wch:14},{wch:10},{wch:12},{wch:14},{wch:12},{wch:12},{wch:24}];
  XLSX.utils.book_append_sheet(wb,ws2,"Parsiyel");
  // Firma performans sheet
  const firmaMap={};S.saGecmis.forEach(s=>{if(!s.firma_ad)return;if(!firmaMap[s.firma_ad])firmaMap[s.firma_ad]={ad:s.firma_ad,sayi:0,toplam:0};firmaMap[s.firma_ad].sayi++;firmaMap[s.firma_ad].toplam+=(s.fiyat||0);});
  const fData=[["Firma Adi","Sevkiyat Sayisi","Toplam Harcama (TL)","Ortalama Fiyat (TL)"]];
  Object.values(firmaMap).sort((a,b)=>b.sayi-a.sayi).forEach(f=>{fData.push([f.ad,f.sayi,f.toplam,Math.round(f.toplam/f.sayi)]);});
  const ws3=XLSX.utils.aoa_to_sheet(fData);ws3["!cols"]=[{wch:28},{wch:16},{wch:20},{wch:18}];
  XLSX.utils.book_append_sheet(wb,ws3,"Firma Performansi");
  XLSX.writeFile(wb,"sevkiyat_raporu_"+new Date().toLocaleDateString("tr-TR").replace(/\./g,"-")+".xlsx");
  showToast("✅ Rapor indirildi!");
};
